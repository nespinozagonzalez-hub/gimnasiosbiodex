<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioDex · Revisión de pantallas</title><style>body{margin:0;background:#0b2027;color:#e5e2c4;font:14px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #58725a;background:#18332f}a{color:#e4d397}label{display:flex;gap:8px;align-items:center}select{padding:8px;background:#10282d;color:#d8ddbd;border:1px solid #7b9674;font:inherit}main{padding:16px;overflow:auto}iframe{display:block;background:#10252b;border:1px solid #829d71;box-shadow:0 4px 22px #0006}small{color:#a9c2ae}</style></head><body><header><a href="revision.html">← Mesa de preparación</a><label>Vista<select id="size"><option value="1024,768">Tablet horizontal · 1024 × 768</option><option value="768,1024">Tablet vertical · 768 × 1024</option><option value="1440,900">PC · 1440 × 900</option></select></label><label>Escena<select id="scene"><option value="index.html">La liga</option><option value="combate.html?gym=aurora">Gimnasio Aurora</option><option value="combate.html?gym=prisma">Gimnasio Prisma</option><option value="combate.html?gym=nexo">Gimnasio Nexo</option><option value="combate.html?gym=nova">Gimnasio Nova</option><option value="combate.html?gym=bruma">Gimnasio Bruma</option></select></label><small>Prueba las pantallas con el equipo de ensayo.</small></header><main><iframe id="preview" title="Vista de prueba de BioDex" src="index.html" width="1024" height="768" allow="fullscreen"></iframe></main><script>const frame=document.getElementById('preview');document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h;});document.getElementById('scene').addEventListener('change',e=>frame.src=e.target.value);</script></body></html>
